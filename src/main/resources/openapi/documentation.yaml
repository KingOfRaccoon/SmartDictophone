          content:
            application/json:
              schema:
                type: object
    put:
      summary: Обновить запись
      tags:
      - Records
      parameters:
      - name: Authorization
        in: header
        description: Bearer {token}
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: ID записи
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Запись успешно обновлена
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Неверный ID записи или данные
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Недействительный токен
          content:
            application/json:
              schema:
                type: object
        '403':
          description: Нет доступа к этой записи
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Запись не найдена
          content:
            application/json:
              schema:
                type: object
    delete:
      summary: Удалить запись
      tags:
      - Records
      parameters:
      - name: Authorization
        in: header
        description: Bearer {token}
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: ID записи
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: Запись успешно удалена
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Неверный ID записи
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Недействительный токен
          content:
            application/json:
              schema:
                type: object
        '403':
          description: Нет доступа к этой записи
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Запись не найдена
          content:
            application/json:
              schema:
                type: object
  /records/{id}/segments:
