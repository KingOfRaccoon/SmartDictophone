openapi: 3.1.0
info:
  title: Smart Dictophone API
  version: 1.0.0
  description: "REST API для умного диктофона с автоматической транскрипцией и организацией записей.\n\n## Основные возмож\
    ности\n- 🔐 Аутентификация через Keycloak (JWT)\n- 📁 Организация записей по папкам\n- 🎙️ Загрузка и хранение аудиофа\
    йлов\n- 📝 Автоматическая транскрипция (через RabbitMQ)\n- 📄 Экспорт транскрипций в PDF\n- 🔍 Поиск по записям\n- 📊\
    \ Статистика использования\n\n## Аутентификация\nAPI использует Keycloak для аутентификации. Получите токен через `/auth/login`\
    \ \nи используйте его в заголовке `Authorization: Bearer {token}`."
servers:
- url: http://localhost:8888
  description: Локальная разработка
- url: https://api.smartdictophone.com
  description: Production
paths:
  /folders:
    get:
      summary: Получить все папки пользователя
      tags:
      - Folders
      parameters:
      - name: Authorization
        in: header
        description: Bearer {token}
        required: true
        schema:
          type: string
      responses:
        '401':
          description: Недействительный токен
          content:
            application/json:
              schema:
                type: object
    post:
      summary: Создать новую папку
      tags:
      - Folders
      parameters:
      - name: Authorization
        in: header
        description: Bearer {token}
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              name: Рабочие записи
              description: Записи с рабочих встреч
      responses:
        '400':
          description: Некорректные данные (пустое имя или ошибка создания)
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Недействительный токен
          content:
            application/json:
              schema:
                type: object
  /folders/{id}:
    put:
      summary: Обновить папку
      tags:
      - Folders
      parameters:
      - name: Authorization
        in: header
        description: Bearer {token}
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: ID папки для обновления
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example:
              name: Важные записи
              description: Самые важные записи
      responses:
        '400':
          description: Некорректный ID папки или пустое имя
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Недействительный токен
          content:
            application/json:
              schema:
                type: object
        '403':
          description: Нет прав на обновление этой папки
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Папка не найдена
          content:
            application/json:
              schema:
                type: object
    delete:
      summary: Удалить папку
      tags:
      - Folders
      parameters:
      - name: Authorization
        in: header
        description: Bearer {token}
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: ID папки для удаления
        required: true
        schema:
          type: integer
      responses:
        '204':
          description: Папка успешно удалена
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Некорректный ID папки
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Недействительный токен
          content:
            application/json:
              schema:
                type: object
        '403':
          description: Нет прав на удаление этой папки
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Папка не найдена
          content:
            application/json:
              schema:
                type: object
        '500':
          description: Ошибка при удалении папки
          content:
            application/json:
              schema:
                type: object
  /records:
    get:
      summary: Получить список записей
      tags:
      - Records
      parameters:
      - name: Authorization
        in: header
        description: Bearer {token}
        required: true
        schema:
          type: string
      - name: search
        in: query
        description: Поисковый запрос по названию или описанию
        required: false
        schema:
          type: string
      - name: folderId
        in: query
        description: ID папки для фильтрации
        required: false
        schema:
          type: integer
      - name: category
        in: query
        description: Категория для фильтрации (Work, Study, Personal)
        required: false
        schema:
          type: string
      - name: page
        in: query
        description: Номер страницы (начиная с 0)
        required: false
        schema:
          type: integer
      - name: size
        in: query
        description: Количество элементов на странице (по умолчанию 20)
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: Список записей с пагинацией
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Недействительный токен
          content:
            application/json:
              schema:
                type: object
    post:
      summary: Создать новую запись
      description: "Загружает аудиофайл и создаёт новую запись. \n                Файл сохраняется в S3 с именем {recordId}.m4a.\n\
        \                Автоматически отправляет задачу на транскрипцию в RabbitMQ."
      tags:
      - Records
      parameters:
      - name: Authorization
        in: header
        description: Bearer {token}
        required: true
        schema:
          type: string
      requestBody:
        description: |-
          Multipart form data с полями:
                              - recordFile (file, required): аудиофайл в формате m4a
                              - name (string, required): название записи
                              - datetime (string, required): дата и время в формате ISO-8601
                              - category (string, required): категория (Work, Study, Personal)
                              - folderId (integer, optional): ID папки. Если не передан или нет доступа, будет выбрана дефолтная папка по категории (Работа/Учёба/Личное)
                              - place (string, optional): место записи (можно передать координаты через запятую)
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
      responses:
        '201':
          description: Запись успешно создана и аудио загружено
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Отсутствуют обязательные поля или ошибка загрузки
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Недействительный токен
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Папка не найдена
          content:
            application/json:
              schema:
                type: object
        '403':
          description: Нет доступа к указанной папке
          content:
            application/json:
              schema:
                type: object
  /records/{id}/audio:
    get:
      summary: Скачать аудиофайл записи
      tags:
      - Records
      parameters:
      - name: Authorization
        in: header
        description: Bearer {token}
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: ID записи
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Аудиофайл (audio/m4a)
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Неверный ID записи
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Недействительный токен
          content:
            application/json:
              schema:
                type: object
        '403':
          description: Нет доступа к этой записи
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Запись не найдена
          content:
            application/json:
              schema:
                type: object
  /records/{id}/pdf:
    get:
      summary: Скачать PDF с транскрипцией
      tags:
      - Records
      parameters:
      - name: Authorization
        in: header
        description: Bearer {token}
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: ID записи
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: PDF файл с транскрипцией (application/pdf)
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Неверный ID записи
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Недействительный токен
          content:
            application/json:
              schema:
                type: object
        '403':
          description: Нет доступа к этой записи
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Запись не найдена или транскрипция отсутствует
          content:
            application/json:
              schema:
                type: object
        '500':
          description: Ошибка генерации PDF
          content:
            application/json:
              schema:
                type: object
