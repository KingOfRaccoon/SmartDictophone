  /records/{id}/transcribe:
    post:
      summary: Сохранить результат транскрипции
      description: |-
        Эндпоинт для ML сервиса транскрипции.
                                Сохраняет сегменты транскрибированного текста для записи
                                и заполняет поле description целым текстом транскрипции (сегменты сортируются по start и склеиваются пробелом).
                                Требуется API ключ в заголовке X-API-Key.
      tags:
      - Records
      - ML Service
      parameters:
      - name: X-API-Key
        in: header
        description: API ключ для ML сервиса
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: ID записи
        required: true
        schema:
          type: integer
      requestBody:
        description: |-
          JSON с сегментами транскрипции:
                                          {
                                              "segments": [
                                                  {
                                                      "start": 0.0,
                                                      "end": 5.2,
                                                      "text": "Текст сегмента"
                                                  }
                                              ]
                                          }
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Транскрипция успешно сохранена
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Неверный ID записи или пустые сегменты
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Неверный API ключ
          content:
            application/json:
              schema:
                type: object
        '404':
          description: Запись не найдена
          content:
            application/json:
              schema:
                type: object
