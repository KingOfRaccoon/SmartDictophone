            schema:
              type: object
      responses:
        '201':
          description: Пользователь успешно создан и авторизован
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Неверный формат данных или отсутствуют обязательные поля
          content:
            application/json:
              schema:
                type: object
        '409':
          description: Пользователь с таким email или username уже существует
          content:
            application/json:
              schema:
                type: object
  /login:
    post:
      summary: Вход в систему
      tags:
      - Authentication
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Успешная аутентификация, возвращаются JWT токены
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Не указан email или пароль
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Неверный email или пароль
          content:
            application/json:
              schema:
                type: object
  /refresh:
    post:
      summary: Обновление токена
      tags:
      - Authentication
      parameters:
      - name: Authorization
        in: header
        description: Bearer {refresh_token}
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Новый access токен успешно получен
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Refresh токен не указан
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Невалидный или истёкший refresh токен
          content:
            application/json:
              schema:
                type: object
  /loginOnToken:
    post:
      summary: Проверить токен и получить данные пользователя
      tags:
      - Authentication
      parameters:
      - name: Authorization
        in: header
        description: Bearer {token}
        required: true
        schema:
          type: string
      responses:
        '401':
          description: Недействительный или отсутствующий токен
          content:
            application/json:
              schema:
                type: object
components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT токен от Keycloak. Получите через POST /auth/login
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: API ключ для сервисных запросов (внутреннее использование)
